name: Operator Example
on: workflow_dispatch
jobs:
  operator:
    runs-on: ubuntu-latest
    steps:
    - name: Logical operation
      run: |
        echo "AND: ${{ true && false }}"
        echo "OR: ${{ true || false }}"
        echo "NOT: ${{ !true }}"

    - name: Comparison operation
      run: |
        echo "Equal: ${{ 10 == 10 }}"
        echo "Not Equal: ${{ 10 != 10 }}"
        echo "Greater: ${{ 10 > 5 }}"
        echo "less: ${{ 10 < 5 }}"
        echo "Greater equal: ${{ 10 >= 5 }}"
        echo "Less equal: ${{ 10 <= 5 }}"
        echo "type Error: ${{ true == 1 }}"

    - name: Group
      run: |
        echo "Group 1: ${{ (true || false) && false }}"
        echo "Group 1: ${{ true || (false && false) }}"
        echo "Group 1: ${{ (10 > 5) && (20 > 10) }}"

    - name: Index
      run: |
        echo "First: ${{ fromJSON('["Apple","Banana","Cherry"]')[0] }}"
        echo "Second: ${{ fromJSON('["Apple","Banana","Cherry"]')[1] }}"
        echo "Third: ${{ fromJSON('["Apple","Banana","Cherry"]')[2] }}"

    - name: Property Access
      run: |
        echo "Repository: ${{ github.repository }}"
        echo "Actor: ${{ github.actor }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Event: ${{ github.event_name }}"
