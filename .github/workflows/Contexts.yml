name: Contexts
on: push
jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.actor }}"
      - name: GitHub Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Actor:      ${{ github.actor }}"
          echo "Event:      ${{ github.event }}"
          echo "Branch:     ${{ github.ref_name }}"
          echo "Commit:     ${{ github.sha }}"
      - name: GitHub Context
        run: |
          echo "Repository: ${{ runner.name }}"
          echo "Repository: ${{ runner.os }}"
          echo "Repository: ${{ runner.arch }}"
          echo "Repository: ${{ runner.environment }}"
          echo "Repository: ${{ runner.temp }}"
